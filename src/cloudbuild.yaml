steps:
  # -------------------------------------------------------
  # 1. Build Docker image
  # -------------------------------------------------------
  - id: "build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "."

  # -------------------------------------------------------
  # 2. Push versioned image
  # -------------------------------------------------------
  - id: "push-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"

  # -------------------------------------------------------
  # 3. Push latest image
  # -------------------------------------------------------
  - id: "push-latest"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"

  # -------------------------------------------------------
  # 4. Deploy to Cloud Run
  # -------------------------------------------------------
  - id: "deploy-cloud-run"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"

      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"

      - "--region"
      - "${_REGION}"

      - "--platform"
      - "managed"

      - "--port"
      - "8080"

      - "--memory"
      - "1Gi"

      - "--cpu"
      - "1"

      - "--timeout"
      - "300"

      - "--concurrency"
      - "10"

      - "--min-instances"
      - "0"

      - "--max-instances"
      - "5"

      - "--allow-unauthenticated"

# ---------------------------------------------------------
# Default variables
# ---------------------------------------------------------
substitutions:
  _REGION: "europe-west1"
  _REPOSITORY: "subtitle-repo"
  _SERVICE_NAME: "subtitle-service"

# ---------------------------------------------------------
# Register produced images with Cloud Build
# ---------------------------------------------------------
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"
